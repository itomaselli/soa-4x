# Builds the Windows installer (.exe) with Tauri on a GitHub Windows machine.
# Run it by hand from the Actions tab ("Compilar para Windows" → Run workflow), or push a tag like v0.1.0
# to also publish a GitHub Release with the installer attached.
name: Compilar para Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar (typecheck, lint, tests)
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Compilar el instalador
        run: npx tauri build

      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: biker4x-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publicar release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
